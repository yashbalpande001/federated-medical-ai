# RSNA Chest X-Ray Medical Dataset Hyperparameters

dataset:
  name: "RSNA Chest X-Ray Pneumonia Detection"
  image_size: 224
  channels: 3
  normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

split:
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1

dataloader:
  batch_size: 32
  shuffle: true
  num_workers: 2

labels:
  num_classes: 2
  class_names: ["No Pneumonia", "Pneumonia"]
